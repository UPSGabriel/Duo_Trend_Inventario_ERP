name: Resolve Flutter lockfile once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  resolve:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true
      - name: Resolve compatible dependencies
        working-directory: apps/duo_trend_app
        run: flutter pub get
      - name: Commit lockfile and remove this one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/duo_trend_app/pubspec.lock
          git rm .github/workflows/resolve-lockfile.yml
          git commit -m 'chore: lock Flutter dependencies'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
