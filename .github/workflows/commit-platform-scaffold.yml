name: Commit Flutter platform scaffold

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scaffold:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true
      - name: Generate official Android and Windows projects
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path apps -Force | Out-Null
          flutter create --platforms=android,windows --org com.duotrend --project-name duo_trend_app apps/duo_trend_app
          $gradle = 'apps/duo_trend_app/android/app/build.gradle.kts'
          (Get-Content -LiteralPath $gradle -Raw).Replace('com.duotrend.duo_trend_app', 'com.duotrend.erp') |
            Set-Content -LiteralPath $gradle -Encoding utf8
          $oldMain = 'apps/duo_trend_app/android/app/src/main/kotlin/com/duotrend/duo_trend_app/MainActivity.kt'
          $newDir = 'apps/duo_trend_app/android/app/src/main/kotlin/com/duotrend/erp'
          if (Test-Path -LiteralPath $oldMain) {
            New-Item -ItemType Directory -Path $newDir -Force | Out-Null
            (Get-Content -LiteralPath $oldMain -Raw).Replace('package com.duotrend.duo_trend_app', 'package com.duotrend.erp') |
              Set-Content -LiteralPath (Join-Path $newDir 'MainActivity.kt') -Encoding utf8
            Remove-Item -LiteralPath $oldMain
          }
      - name: Commit generated scaffold when needed
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/duo_trend_app
          $tree = git write-tree
          Write-Output "SCAFFOLD_TREE_SHA=$tree"
          if (-not (git diff --cached --quiet)) {
            git commit -m 'chore: add generated Flutter platforms'
            git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
          }
