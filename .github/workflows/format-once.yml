name: Format Flutter sources once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true
      - name: Format Phase 0 Dart sources
        run: dart format apps/duo_trend_app/lib apps/duo_trend_app/test
      - name: Commit formatting and remove this one-time workflow
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/duo_trend_app/lib apps/duo_trend_app/test
          git rm .github/workflows/format-once.yml
          git commit -m 'style: format Flutter sources'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
